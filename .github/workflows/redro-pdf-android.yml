name: Redro PDF Android Build

on:
  workflow_dispatch:
  push:
    paths:
      - "mobile/**"
      - ".github/workflows/redro-pdf-android.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android platform scaffolding
        working-directory: mobile
        run: |
          flutter create --platforms=android --project-name=redro_pdf --org=com.redro --no-pub .
          rm -f test/widget_test.dart
      - name: Set Android compile SDK
        working-directory: mobile
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("android/app/build.gradle.kts")
          if path.exists():
              source = path.read_text()
              source = source.replace("compileSdk = flutter.compileSdkVersion", "compileSdk = 36")
              path.write_text(source)
          else:
              path = Path("android/app/build.gradle")
              source = path.read_text()
              source = source.replace("compileSdkVersion flutter.compileSdkVersion", "compileSdkVersion 36")
              path.write_text(source)
          PY
      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get
      - name: Static analysis
        working-directory: mobile
        run: flutter analyze
      - name: Run widget tests
        working-directory: mobile
        run: flutter test
      - name: Build installable debug APK
        working-directory: mobile
        run: flutter build apk --debug
      - name: Verify APK output
        run: test -s mobile/build/app/outputs/flutter-apk/app-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: redro-pdf-android-debug
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
