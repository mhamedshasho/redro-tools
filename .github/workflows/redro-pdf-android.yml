name: Redro PDF Android Build

on:
  workflow_dispatch:
  push:
    paths:
      - "mobile/**"
      - ".github/workflows/redro-pdf-android.yml"
  pull_request:
    paths:
      - "mobile/**"
      - ".github/workflows/redro-pdf-android.yml"

permissions:
  contents: read

concurrency:
  group: redro-pdf-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.9"
          cache: true
      - name: Show Flutter version
        run: flutter --version
      - name: Generate Android platform scaffolding
        working-directory: mobile
        run: |
          flutter create --platforms=android --project-name=redro_pdf --org=com.redro --no-pub .
          rm -f test/widget_test.dart
      - name: Install Android API 36
        run: |
          sdkmanager_path="$(command -v sdkmanager || true)"
          if [ -z "$sdkmanager_path" ]; then
            sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
            if [ -z "$sdk_root" ] || [ ! -d "$sdk_root/cmdline-tools" ]; then
              echo "Android SDK command-line tools were not found." >&2
              exit 1
            fi
            sdkmanager_path="$(find "$sdk_root/cmdline-tools" -type f -name sdkmanager -print -quit)"
          fi
          if [ -z "$sdkmanager_path" ] || [ ! -x "$sdkmanager_path" ]; then
            echo "sdkmanager could not be located in the installed Android SDK." >&2
            exit 1
          fi
          set +o pipefail
          yes | "$sdkmanager_path" --licenses >/dev/null
          set -o pipefail
          "$sdkmanager_path" --install "platforms;android-36" "build-tools;36.0.0"
      - name: Set and verify Android compile SDK
        working-directory: mobile
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          kotlin = Path("android/app/build.gradle.kts")
          groovy = Path("android/app/build.gradle")
          if kotlin.exists():
              source = kotlin.read_text()
              updated, count = re.subn(
                  r"(?m)^(\s*compileSdk\s*=\s*).+$",
                  r"\g<1>36",
                  source,
                  count=1,
              )
              path = kotlin
              expected = r"(?m)^\s*compileSdk\s*=\s*36\s*$"
          elif groovy.exists():
              source = groovy.read_text()
              updated, count = re.subn(
                  r"(?m)^(\s*compileSdkVersion\s+).+$",
                  r"\g<1>36",
                  source,
                  count=1,
              )
              path = groovy
              expected = r"(?m)^\s*compileSdkVersion\s+36\s*$"
          else:
              raise SystemExit("Generated Android app Gradle file is missing.")
          if count != 1 or not re.search(expected, updated):
              raise SystemExit(f"Unable to set compileSdk 36 in {path}.")
          path.write_text(updated)
          print(f"Verified compileSdk 36 in {path}")
          PY
          python3 - <<'PY'
          from pathlib import Path
          import re
          for path in [Path("android/app/src/main/AndroidManifest.xml")]:
              if path.exists():
                  text = path.read_text()
                  text = re.sub(r'android:label="[^"]+"', 'android:label="Redro PDF"', text, count=1)
                  path.write_text(text)
          PY
      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get
      - name: Upload resolved dependency lockfile
        uses: actions/upload-artifact@v4
        with:
          name: redro-pdf-dependency-lock
          path: mobile/pubspec.lock
          if-no-files-found: error
          retention-days: 30
      - name: Static analysis
        working-directory: mobile
        run: flutter analyze
      - name: Run automated tests
        working-directory: mobile
        run: flutter test
      - name: Build optimized release APKs per ABI
        working-directory: mobile
        run: flutter build apk --release --split-per-abi
      - name: Verify release APK outputs and size
        run: |
          set -euo pipefail
          output="mobile/build/app/outputs/flutter-apk"
          for abi in armeabi-v7a arm64-v8a x86_64; do
            apk="$output/app-$abi-release.apk"
            test -s "$apk"
            bytes="$(stat -c%s "$apk")"
            echo "$apk: $bytes bytes"
            if [ "$bytes" -ge 100000000 ]; then
              echo "$apk exceeds the 100 MB per-APK target." >&2
              exit 1
            fi
          done
      - name: Upload per-ABI release APKs
        uses: actions/upload-artifact@v4
        with:
          name: redro-pdf-android-release-split
          path: |
            mobile/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            mobile/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            mobile/build/app/outputs/flutter-apk/app-x86_64-release.apk
          if-no-files-found: error
          retention-days: 30
