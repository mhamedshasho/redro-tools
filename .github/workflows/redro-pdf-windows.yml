name: Redro PDF Windows Portable Build

on:
  workflow_dispatch:
  push:
    paths:
      - "mobile/**"
      - ".github/workflows/redro-pdf-windows.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get
      - name: Validate
        working-directory: mobile
        run: flutter analyze
      - name: Build Windows release
        working-directory: mobile
        run: flutter build windows --release
      - name: Package portable files
        shell: pwsh
        run: |
          Compress-Archive -Path mobile/build/windows/x64/runner/Release/* -DestinationPath redro-pdf-windows-portable.zip -Force
      - name: Upload portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: redro-pdf-windows-portable
          path: redro-pdf-windows-portable.zip
          if-no-files-found: error
