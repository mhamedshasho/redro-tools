name: redro_pdf
description: Redro PDF Converter — export selectable PDF text to editable Word and Excel files.
publish_to: "none"
version: 0.3.0+3

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  archive: ^3.6.1
  cupertino_icons: ^1.0.8
  excel: ^4.0.6
  file_picker: ^13.3.3
  syncfusion_flutter_pdf: ^35.1.43

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/redro_logo.jpg
    - assets/branding/redro_logo_mark.jpg
